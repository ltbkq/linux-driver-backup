# ============================================================
# Linux 驱动备份与还原工具 —— CI 流水线
# Linux driver backup & restore tool — CI pipeline
#
# 结构 / Layout:
#   1) test    —— 单元测试（cargo test --locked --no-fail-fast）
#   2) lint    —— 门禁：fmt --check / clippy -D warnings / shellcheck / desktop-file-validate（W9-C54）
#   3) audit   —— cargo audit 依赖漏洞扫描（W9-C54）
#   4) msrv    —— MSRV 1.92 编译（W9-C54）
#   5) build   —— 矩阵编译（x86_64 / aarch64）+ sha256 清单 + aarch64 qemu 运行冒烟
#   6) package —— 复用二进制产出 deb / tar.gz / rpm（fedora+suse 双目标）/ AppImage 并做安装冒烟
#   7) aur     —— 打 tag 时渲染 AUR PKGBUILD + .SRCINFO（W8-C52）
#   8) release —— 仅在 v* 标签时，先断言 tag==Cargo.toml 版本，再汇总产物并创建 Release
#
# 供应链 / Supply chain（W9-C09）：
#   全部第三方 action 一律 pin 到 commit SHA，禁止可变 tag。
#   appimagetool 固定版本并校验 SHA-256（W9-C08）。
#
# 环境事实（DESIGN.md §2 / §7，勿臆造）：
#   - Slint 使用 default-features = false + backend-winit-x11 / backend-winit-wayland
#     + renderer-winit-software（软件渲染），编译期需要 pkg-config 与 X11/Wayland/
#     xkbcommon 开发头文件，并硬链接 fontconfig/freetype；
#   - [profile.release] 已设 strip = true（DESIGN.md §2.1），产物为单个可执行文件。
# ============================================================

name: build

# 触发 / Triggers：主干分支 push、PR、v* 标签（标签触发用于自动发版），
# 以及手动触发（workflow_dispatch）——用于在打标签前先验证交叉编译/打包链路。
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 默认只读；仅 release 作业单独提权（遵循最小权限原则）
permissions:
  contents: read

# 同一 ref 的重复运行只保留最新（PR 取消旧的，主干/标签保留以保证可追溯）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ----------------------------------------------------------
  # 1) 单元测试 / unit tests
  # ----------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-22.04
    steps:
      - name: 检出源码 / Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)

      - name: 安装 Rust 稳定版 / Install Rust stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (pinned)
        with:
          toolchain: stable

      - name: 安装编译期系统依赖 / Install build-time system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libgtk-3-dev

      - name: 缓存 cargo / Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (pinned)
        with:
          key: test

      - name: 运行测试 / Run tests
        # --locked：严格按 Cargo.lock 构建/测试；--no-fail-fast：尽量跑完全部测试再报告
        run: cargo test --locked --no-fail-fast

  # ----------------------------------------------------------
  # 2) lint 门禁 / lint gates（W9-C54）
  #    README:389 已承诺 clippy 零告警，此处正式纳入 CI。
  # ----------------------------------------------------------
  lint:
    name: lint (fmt / clippy / shellcheck / desktop)
    runs-on: ubuntu-22.04
    steps:
      - name: 检出源码 / Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)

      - name: 安装 Rust + rustfmt/clippy / Install Rust with components
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (pinned)
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: 安装 lint 依赖 / Install lint tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libgtk-3-dev \
            shellcheck \
            desktop-file-utils

      - name: 缓存 cargo / Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (pinned)
        with:
          key: lint

      - name: 格式检查 / cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Clippy（零告警）/ clippy -D warnings
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: ShellCheck 打包脚本 / shellcheck packaging scripts
        run: |
          shellcheck -x \
            packaging/install.sh \
            packaging/build-packages.sh \
            packaging/build-appimage.sh \
            packaging/lib/common.sh \
            packaging/appimage/AppDir/AppRun

      - name: 校验 desktop 文件 / desktop-file-validate
        run: desktop-file-validate packaging/linux-driver-backup.desktop

  # ----------------------------------------------------------
  # 3) 依赖漏洞扫描 / dependency audit（W9-C54）
  # ----------------------------------------------------------
  audit:
    name: cargo audit
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      checks: write   # rustsec/audit-check 需要创建 check run
    steps:
      - name: 检出源码 / Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)

      - name: 审计 Cargo.lock / audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2 (pinned)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------
  # 4) MSRV 编译 / MSRV build（W9-C54，Cargo.toml rust-version = 1.92）
  # ----------------------------------------------------------
  msrv:
    name: MSRV 1.92
    runs-on: ubuntu-22.04
    steps:
      - name: 检出源码 / Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)

      - name: 安装 Rust 1.92 / Install Rust 1.92
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (pinned)
        with:
          toolchain: 1.92.0

      - name: 安装编译期系统依赖 / Install build-time system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libgtk-3-dev

      - name: 缓存 cargo / Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (pinned)
        with:
          key: msrv

      - name: MSRV 检查编译 / cargo check --locked
        run: cargo check --locked

  # ----------------------------------------------------------
  # 5) 矩阵编译 / matrix build
  #    - x86_64：本机编译，runner 固定 ubuntu-22.04（glibc 2.35）
  #    - aarch64：交叉编译（taiki-e 交叉工具链），并在 qemu 下做运行冒烟（W9-C57）
  # ----------------------------------------------------------
  build:
    name: build (${{ matrix.target }})
    needs: [test, lint, audit, msrv]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            cross: true
    steps:
      - name: 检出源码 / Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)

      - name: 安装 Rust 稳定版与目标 / Install Rust stable + target
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (pinned)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: 安装编译期系统依赖 / Install build-time system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libgtk-3-dev

      - name: 配置 aarch64 交叉工具链 / Set up aarch64 cross toolchain
        if: matrix.cross
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1 (pinned)
        with:
          target: aarch64-unknown-linux-gnu

      - name: 安装 aarch64 系统库（fontconfig/freetype）/ Install arm64 sysroot libs
        # Slint 的软件渲染会**硬链接** libfontconfig 与 libfreetype（DESIGN.md §11.4）。
        # 用 Debian 多架构在同一 runner 上装 arm64 开发库，并提供 arm64 运行库供 qemu 冒烟。
        if: matrix.cross
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture arm64
          # ubuntu-22.04 走 /etc/apt/sources.list（非 deb822）；把既有源显式限定为 amd64，
          # 再补一条 arm64 的 ports 源，避免 apt 试图从 amd64 源取 arm64 包而 404。
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse' \
            | sudo tee /etc/apt/sources.list.d/arm64-ports.list >/dev/null
          echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse' \
            | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list >/dev/null
          echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse' \
            | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev:arm64 \
            libfreetype-dev:arm64 \
            libexpat1-dev:arm64
          ls -l /usr/lib/aarch64-linux-gnu/libfontconfig* /usr/lib/aarch64-linux-gnu/libfreetype*
          ls -l /usr/lib/aarch64-linux-gnu/pkgconfig/fontconfig.pc

      - name: 缓存 cargo / Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (pinned)
        with:
          key: ${{ matrix.target }}

      - name: 编译 release / Build release
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            export PKG_CONFIG_ALLOW_CROSS=1
            export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
            export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
            export PKG_CONFIG_SYSROOT_DIR=/
            # aarch64 交叉无 GTK sysroot：关闭 gui-dialogs（原生文件对话框可选特性）。
            cargo build --locked --release --target ${{ matrix.target }} --no-default-features
          else
            cargo build --locked --release --target ${{ matrix.target }}
          fi

      - name: strip 二进制 / Strip the binary
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/linux-driver-backup"
          case "${{ matrix.target }}" in
            x86_64-*)              strip "$bin" || true ;;
            aarch64-*)             aarch64-linux-gnu-strip "$bin" || true ;;
            *)                     echo "unknown target: ${{ matrix.target }}"; exit 1 ;;
          esac

      - name: aarch64 运行冒烟 / run arm64 binary under qemu (W9-C57)
        if: matrix.cross
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends qemu-user-static
          bin="target/${{ matrix.target }}/release/linux-driver-backup"
          # 多架构 libc 的 loader 位于 /lib，交叉 sysroot 位于 /usr/aarch64-linux-gnu；
          # 两种前缀各试一次，任一成功即视为通过。
          qemu-aarch64-static -L /usr/aarch64-linux-gnu "$bin" --version \
            || qemu-aarch64-static "$bin" --version

      - name: 打包产物并生成 SHA-256 清单 / Stage artifacts + checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          src="target/${{ matrix.target }}/release/linux-driver-backup"
          name="linux-driver-backup-${{ matrix.target }}"
          test -f "$src"
          cp "$src" "dist/$name"
          chmod +x "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          echo "=== SHA-256 清单 / checksum manifest ==="
          cat "dist/$name.sha256"

      - name: 上传构建产物 / Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned)
        with:
          name: linux-driver-backup-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # ----------------------------------------------------------
  # 6) 打包 / package
  #    复用 x86_64/aarch64 二进制，产出四种格式（DESIGN.md §11）：
  #      .deb / .tar.gz + install.sh / .rpm（fedora+suse 双目标，W8-C53）/ AppImage
  # ----------------------------------------------------------
  package:
    name: package
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: 检出源码 / Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)

      - name: 下载两个架构的二进制产物 / Download both arch artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 (pinned)
        with:
          pattern: linux-driver-backup-*-unknown-linux-gnu
          merge-multiple: true
          path: artifacts

      - name: 安装打包工具 / Install packaging tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: 还原二进制 / Unpack binaries
        run: |
          set -euo pipefail
          mkdir -p target/release
          install -m 0755 artifacts/linux-driver-backup-x86_64-unknown-linux-gnu \
            target/release/linux-driver-backup-x86_64
          install -m 0755 artifacts/linux-driver-backup-aarch64-unknown-linux-gnu \
            target/release/linux-driver-backup-aarch64
          if command -v file >/dev/null 2>&1; then
            file target/release/linux-driver-backup-x86_64 target/release/linux-driver-backup-aarch64
          fi

      - name: 构建 amd64 包（deb/tar/rpm）/ Build amd64 packages
        run: |
          set -euo pipefail
          bash packaging/build-packages.sh deb tar --arch amd64 \
            --bin target/release/linux-driver-backup-x86_64
          bash packaging/build-packages.sh rpm --arch amd64 --rpm-target both \
            --bin target/release/linux-driver-backup-x86_64

      - name: 构建 arm64 包（deb/tar/rpm）/ Build arm64 packages
        run: |
          set -euo pipefail
          bash packaging/build-packages.sh deb tar --arch arm64 \
            --bin target/release/linux-driver-backup-aarch64
          bash packaging/build-packages.sh rpm --arch arm64 --rpm-target both \
            --bin target/release/linux-driver-backup-aarch64

      - name: 构建 AppImage / Build AppImage
        # appimagetool 固定版本并校验 SHA-256（W9-C08）；脚本内下载失败按 DESIGN
        # §11.4 降级（exit 0），不再叠加 continue-on-error。
        run: |
          set -euo pipefail
          bash packaging/build-appimage.sh \
            --bin target/release/linux-driver-backup-x86_64 --arch amd64

      - name: 检查打包产物 / Verify package outputs
        run: |
          set -euo pipefail
          echo "=== 打包产物 / package outputs ==="
          ls -l dist
          ls dist/*_amd64.deb
          ls dist/*_arm64.deb
          ls dist/*linux-x86_64.tar.gz
          ls dist/*linux-aarch64.tar.gz
          for f in dist/*.deb dist/*.tar.gz dist/*.rpm dist/*.AppImage; do
            [ -e "$f" ] || continue
            test -f "$f.sha256"
          done
          ls dist/*.rpm 2>/dev/null || echo "::warning::未产出 rpm（检查 rpmbuild 步骤日志）"

          # --- RPM 依赖回归断言 / RPM dependency regression guard ---
          # 断言 Requires 里不出现裸 `wayland`，且硬链接依赖已由 rpmbuild
          # 自动生成为 soname（libfontconfig.so.1）；fedora 目标应含 libwayland-client。
          for f in dist/*.rpm; do
            [ -e "$f" ] || continue
            echo "--- $(basename "$f") 的 Requires / requires ---"
            reqs="$(rpm -qpR "$f")"
            printf '%s\n' "$reqs"
            if printf '%s\n' "$reqs" | awk '{print $1}' | grep -qx 'wayland'; then
              echo "::error::$(basename "$f") 的 Requires 含非法包名 wayland（应为 libwayland-client）"
              exit 1
            fi
            if ! printf '%s\n' "$reqs" | grep -q 'libfontconfig\.so\.1'; then
              echo "::error::$(basename "$f") 缺少自动生成的 libfontconfig.so.1 依赖"
              exit 1
            fi
          done

      - name: 安装冒烟 / install smoke tests (W9-C57)
        run: |
          set -euo pipefail
          ver="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          # 预装 deb 运行依赖，避免 dpkg 因缺少 Recommends/Depends 报错
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1 libfreetype6 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0

          echo "--- deb 安装冒烟 / dpkg -i ---"
          sudo dpkg -i "dist/linux-driver-backup_${ver}_amd64.deb"
          /usr/bin/linux-driver-backup --version
          /usr/bin/linux-driver-backup --scan --mode minimal --json >/dev/null \
            || echo "::warning::--scan 冒烟返回非零（不阻断，仅提示）"
          sudo dpkg -r linux-driver-backup

          echo "--- rpm 安装冒烟 / rpm -ivh（fedora 目标） ---"
          sudo rpm -ivh --nodeps --noscripts "dist/linux-driver-backup-${ver}-1.fedora.x86_64.rpm"
          /usr/bin/linux-driver-backup --version
          sudo rpm -e --nodeps linux-driver-backup

          echo "--- tar + install.sh 冒烟 ---"
          tmp="$(mktemp -d)"
          tar -xzf "dist/linux-driver-backup-${ver}-linux-x86_64.tar.gz" -C "$tmp"
          "$tmp/linux-driver-backup-${ver}-linux-x86_64/install.sh" \
            --prefix="$tmp/prefix" --no-polkit
          "$tmp/prefix/bin/linux-driver-backup" --version
          rm -rf "$tmp"

      - name: 上传打包产物 / Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned)
        with:
          name: linux-driver-backup-packages
          path: dist/*
          if-no-files-found: error

  # ----------------------------------------------------------
  # 7) AUR 元数据 / AUR metadata（W8-C52）
  #    仅在打 tag 时运行（tag 归档已可下载，才能算真实 sha256）。
  # ----------------------------------------------------------
  aur:
    name: aur (PKGBUILD + .SRCINFO)
    needs: [test, lint]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    steps:
      - name: 检出源码 / Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)

      - name: 渲染 PKGBUILD 并生成 .SRCINFO / render + generate
        run: |
          set -euo pipefail
          bash packaging/build-packages.sh arch
          test -f dist/aur/PKGBUILD
          test -f dist/aur/.SRCINFO
          echo "=== .SRCINFO ==="
          cat dist/aur/.SRCINFO
          if grep -q 'SKIP' dist/aur/.SRCINFO; then
            echo "::error::.SRCINFO 的 sha256sums 仍为 SKIP，AUR 不接受"
            exit 1
          fi

      - name: 上传 AUR 产物 / Upload AUR files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned)
        with:
          name: ldb-aur-package
          path: |
            dist/aur/PKGBUILD
            dist/aur/.SRCINFO
          if-no-files-found: error

  # ----------------------------------------------------------
  # 8) 发布 / release
  #    仅在 v* 标签时运行；先断言 tag == Cargo.toml 版本（W9-C54），
  #    再下载全部产物、逐份 sha256sum -c 复验后创建 Release。
  # ----------------------------------------------------------
  release:
    name: release
    needs: [test, lint, audit, msrv, build, package, aur]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # 创建 Release / 上传资产需要写权限
    steps:
      - name: 检出源码 / Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)

      - name: 断言 tag 与 Cargo.toml 版本一致 / tag == Cargo.toml version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "tag=$tag version=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag 与 Cargo.toml version $ver 不一致，拒绝发布"
            exit 1
          fi

      - name: 下载全部产物 / Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 (pinned)
        with:
          path: dist
          merge-multiple: true   # 把矩阵产物与打包产物合并到同一目录
          pattern: linux-driver-backup-*

      - name: 校对产物 / Verify checksums
        run: |
          set -euo pipefail
          echo "=== 待发布文件 / files to release ==="
          ls -l dist

          count=0
          for f in dist/*.sha256; do
            [ -e "$f" ] || continue
            count=$((count + 1))
            echo "--- 复验 / verify: $(basename "$f") ---"
            (cd dist && sha256sum -c "$(basename "$f")")
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::未找到任何 .sha256 清单"
            exit 1
          fi

          for f in dist/*; do
            [ -e "$f" ] || continue
            case "$f" in *.sha256) continue ;; esac
            base="$(basename "$f")"
            if ! grep -qF "  $base" dist/*.sha256; then
              echo "::error::缺少 SHA-256 记录: $base"
              exit 1
            fi
          done
          echo "=== 全部校验通过 / all checksums OK ==="

      - name: 创建 GitHub Release / Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 (pinned)
        with:
          files: |
            dist/*
          generate_release_notes: true
